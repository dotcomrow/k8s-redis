---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-vault-bootstrap
  namespace: redis
---
# In the vault ns: allow reading just the 'vault-root-token' Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-vault-root-token
  namespace: vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["vault-root-token"]   # tighten to the exact Secret name you use
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-to-read-root-token
  namespace: vault
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-vault-root-token
---
# In the redis ns: allow creating/updating Secrets (only if you want to write any there)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: redis
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-secret-write
  namespace: redis
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-vault-bootstrap
  namespace: redis
spec:
  backoffLimit: 6
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: redis-vault-bootstrap
      restartPolicy: OnFailure
      ttlSecondsAfterFinished: 1800
      securityContext:
        runAsUser: 0   # allow apk to install packages
      containers:
        - name: bootstrap
          image: alpine/k8s:1.31.4
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -Eeuo pipefail
              trap 'echo "❌ Bootstrap failed at line $LINENO"; exit 1' ERR

              echo "🔐 Fetching Vault root/admin token from vault namespace…"
              get_tok() {
                key="$1"
                kubectl -n vault get secret vault-root-token \
                  -o "go-template={{index .data \"${key}\" | base64decode}}" 2>/dev/null || true
              }
              VAULT_TOKEN="$(get_tok VAULT_TOKEN)"
              [ -n "$VAULT_TOKEN" ] || VAULT_TOKEN="$(get_tok token)"
              [ -n "$VAULT_TOKEN" ] || VAULT_TOKEN="$(get_tok root-token)"
              [ -n "$VAULT_TOKEN" ] || VAULT_TOKEN="$(get_tok root_token)"
              if [ -z "$VAULT_TOKEN" ]; then
                echo "❌ Could not decode token from Secret 'vault-root-token'. Keys present:"
                kubectl -n vault get secret vault-root-token -o jsonpath='{.data}'
                exit 1
              fi

              echo "⏳ Waiting for a running Vault server pod…"
              # Grab the first Running pod with a 'vault' label; adjust selector if yours differs.
              SEL='app.kubernetes.io/name=vault'
              for i in $(seq 1 120); do
                VAULT_POD="$(kubectl -n vault get pod -l "$SEL" \
                  -o jsonpath='{.items[?(@.status.phase=="Running")][0].metadata.name}' 2>/dev/null || true)"
                if [ -z "$VAULT_POD" ]; then
                  # fallback to statefulset naming
                  kubectl -n vault get pod vault-0 >/dev/null 2>&1 && VAULT_POD="vault-0" || true
                fi
                [ -n "$VAULT_POD" ] && break
                sleep 2
              done
              if [ -z "$VAULT_POD" ]; then
                echo "❌ No running Vault pod found (selector: $SEL, fallback vault-0)."
                kubectl -n vault get pods -o wide || true
                exit 1
              fi
              echo "✅ Using Vault pod: $VAULT_POD"

              VENV="export VAULT_ADDR='$VAULT_ADDR' VAULT_TOKEN='$VAULT_TOKEN';"

              echo "🔎 Ensuring KV v2 enabled at path 'kv/'…"
              kubectl -n vault exec "$VAULT_POD" -- sh -lc "
                $VENV
                if ! vault secrets list -format=json | grep -q '\"kv/\"'; then
                  vault secrets enable -version=2 -path=kv kv
                else
                  # verify v2
                  vault secrets list -detailed -format=json | grep -q '\"kv/\".*\"version\": 2' || {
                    echo 'kv/ exists but not v2'; exit 1; }
                fi
              "

              echo "🔑 Ensuring kv/redis secret exists…"
              kubectl -n vault exec "$VAULT_POD" -- sh -lc "
                $VENV
                if ! vault kv get -format=json kv/redis >/dev/null 2>&1; then
                  PW=\$(head -c 32 /dev/urandom | base64 | tr -d '\n=')
                  vault kv put kv/redis password=\"\$PW\"
                fi
              "

              echo "🛡️  Writing redis-policy…"
              kubectl -n vault exec "$VAULT_POD" -- sh -lc "
                $VENV
                cat >/tmp/redis-policy.hcl <<'HCL'
                path \"kv/data/redis\" {
                  capabilities = [\"read\"]
                }
                HCL
                vault policy write redis-policy /tmp/redis-policy.hcl
              "

              echo "🔓 Ensuring kubernetes auth is enabled…"
              kubectl -n vault exec "$VAULT_POD" -- sh -lc "
                $VENV
                vault auth list -format=json | grep -q '\"kubernetes/\"' || vault auth enable kubernetes
              "

              echo "👤 Upserting role auth/kubernetes/role/redis-role…"
              kubectl -n vault exec "$VAULT_POD" -- sh -lc "
                $VENV
                vault write auth/kubernetes/role/redis-role \
                  bound_service_account_names=redis \
                  bound_service_account_namespaces=redis \
                  policies=redis-policy \
                  ttl=24h
              "

              echo "🎉 Vault bootstrap complete."
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: redis
type: Opaque
data:
  # change this later: echo -n 'changeMeNow!' | base64
  password: Y2hhbmdlTWVOb3ch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    port 6379
    bind 0.0.0.0
    protected-mode no
    appendonly yes
    # RDB off by default; add 'save 900 1' if you want snapshots
    save ""
    tcp-keepalive 300
    timeout 0
    # Auth is injected at runtime via command args:
    #   requirepass <password>
    #   masterauth <password>

  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    protected-mode no
    daemonize no
    sentinel monitor mymaster redis-0.redis-headless.redis.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 60000
    sentinel resolve-hostnames yes

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels: { app: redis }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "redis-role"
        # KV v2 path; adjust if your mount path differs
        vault.hashicorp.com/agent-inject-secret-password: "kv/data/redis"
        vault.hashicorp.com/agent-inject-template-password: |
          {{- with secret "kv/data/redis" -}}
          {{ .Data.data.password }}
          {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      # Only schedule on work/srvr nodes; avoid ctrl/etcd without new labels
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values: ["work-node", "srvr-node"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: redis }
            topologyKey: kubernetes.io/hostname
      tolerations: [] # don’t tolerate control-plane/etcd taints
      securityContext:
        fsGroup: 1001
      volumes:
        - name: cfg-ro
          configMap:
            name: redis-config
        - name: cfg-rw
          emptyDir: {}
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: cfg-ro, mountPath: /config }   # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc","
              set -e
              REDIS_PASSWORD=$(cat /vault/secrets/password)
              cp /config/redis.conf /etc/redis/redis.conf
              echo \"requirepass ${REDIS_PASSWORD}\" >> /etc/redis/redis.conf
              echo \"masterauth ${REDIS_PASSWORD}\" >> /etc/redis/redis.conf
              case \"$(hostname)\" in *-0) ;; *) echo 'replicaof redis-0.redis-headless.redis.svc.cluster.local 6379' >> /etc/redis/redis.conf ;; esac
              trap 'redis-cli -a \"$(cat /vault/secrets/password)\" shutdown nosave || true' TERM INT
              exec redis-server /etc/redis/redis.conf
            "]
          readinessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "512Mi" }

        - name: sentinel
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 26379, name: sentinel }
          volumeMounts:
            - { name: cfg-ro, mountPath: /config }   # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc","
              set -e
              cp /config/sentinel.conf /etc/redis/sentinel.conf
              echo \"sentinel auth-pass mymaster $(cat /vault/secrets/password)\" >> /etc/redis/sentinel.conf
              exec redis-sentinel /etc/redis/sentinel.conf
            "]
          readinessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" -p 26379 ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" -p 26379 ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: redis
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis }
