---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-vault-bootstrap
  namespace: redis
---
# In the vault ns: allow reading just the 'vault-root-token' Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-vault-root-token
  namespace: vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["vault-root-token"]   # tighten to the exact Secret name you use
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-to-read-root-token
  namespace: vault
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-vault-root-token
---
# In the redis ns: allow creating/updating Secrets (only if you want to write any there)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: redis
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-secret-write
  namespace: redis
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer
---
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-vault-bootstrap
  namespace: redis
spec:
  backoffLimit: 6
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: redis-vault-bootstrap
      restartPolicy: OnFailure
      ttlSecondsAfterFinished: 1800
      securityContext:
        runAsUser: 0           # allow apk to install packages
        runAsNonRoot: false
      containers:
      - name: bootstrap
        image: alpine/k8s:1.31.4
        env:
          - name: VAULT_ADDR
            value: "http://vault.vault.svc.cluster.local:8200"  # adjust if different
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -Eeuo pipefail
            trap 'echo "❌ Bootstrap failed at line $LINENO"; exit 1' ERR

            echo "📦 Installing utilities (curl jq coreutils)…"
            apk add --no-cache curl jq coreutils >/dev/null

            echo "🔐 Fetching Vault root/admin token from vault namespace…"
            get_tok() {
              key="$1"
              kubectl -n vault get secret vault-root-token \
                -o "go-template={{index .data \"${key}\" | base64decode}}" 2>/dev/null || true
            }
            VAULT_TOKEN="$(get_tok VAULT_TOKEN)"
            [ -n "$VAULT_TOKEN" ] || VAULT_TOKEN="$(get_tok token)"
            [ -n "$VAULT_TOKEN" ] || VAULT_TOKEN="$(get_tok root-token)"
            [ -n "$VAULT_TOKEN" ] || VAULT_TOKEN="$(get_tok root_token)"
            if [ -z "$VAULT_TOKEN" ]; then
              echo "❌ Could not decode token from Secret 'vault-root-token'. Keys present:"
              kubectl -n vault get secret vault-root-token -o jsonpath='{.data}' || true
              exit 1
            fi

            echo "⏳ Waiting for Vault health at ${VAULT_ADDR}…"
            i=0
            until curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/sys/health" >/dev/null; do
              i=$((i+1)); [ "$i" -gt 120 ] && { echo "❌ Vault not healthy after 240s"; exit 1; }
              sleep 2
            done
            echo "✅ Vault reachable. Bootstrapping kv/redis, policy, and k8s role…"

            VAULT_API() {
              METHOD="$1"; PATH="$2"; BODYFILE="${3:-}";
              if [ -n "$BODYFILE" ]; then
                HTTP="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                  -X "$METHOD" --data-binary @"$BODYFILE" \
                  "${VAULT_ADDR}/v1/${PATH}" || true)"
              else
                HTTP="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" \
                  -X "$METHOD" "${VAULT_ADDR}/v1/${PATH}" || true)"
              fi
              if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 400 ]; then
                echo "❌ ${METHOD} /v1/${PATH} -> HTTP ${HTTP}"
                echo "── Response:"; sed 's/^/   /' /tmp/resp.txt
                exit 1
              fi
              cat /tmp/resp.txt
            }

            # 1) Ensure KV v2 is enabled at 'kv/'
            MOUNTS_JSON="$(VAULT_API GET sys/mounts)"
            echo "$MOUNTS_JSON" | grep -q '"kv/":{' || {
              echo "ℹ️ Enabling KV v2 at path 'kv/'"
              printf '{"type":"kv","options":{"version":"2"}}' > /tmp/kv-enable.json
              VAULT_API POST sys/mounts/kv /tmp/kv-enable.json >/dev/null
            }
            # sanity-check version is v2
            MOUNTS_JSON="$(VAULT_API GET sys/mounts)"
            echo "$MOUNTS_JSON" | grep -q '"kv/".*"options":{"version":"2"' || {
              echo "❌ Mount 'kv/' exists but is not KV v2. Please migrate or change path."
              exit 1
            }

            # 2) Ensure kv/redis secret exists (KV v2 write to /data)
            if ! curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/redis" >/dev/null; then
              PW="$(head -c 32 /dev/urandom | base64 | tr -d '\n=')"
              printf '{"data":{"password":"%s"}}' "${PW}" > /tmp/kv.json
              echo "🔑 Creating kv/redis"
              VAULT_API POST kv/data/redis /tmp/kv.json >/dev/null
            else
              echo "🔑 kv/redis already exists; leaving password unchanged."
            fi

            # 3) Ensure kubernetes auth method is enabled
            AUTHS_JSON="$(VAULT_API GET sys/auth)"
            echo "$AUTHS_JSON" | grep -q '"kubernetes/":{"type":"kubernetes"' || {
              echo "ℹ️ Enabling kubernetes auth at 'auth/kubernetes'"
              printf '{"type":"kubernetes"}' > /tmp/auth-enable.json
              VAULT_API POST sys/auth/kubernetes /tmp/auth-enable.json >/dev/null
              echo "   (Remember to configure auth/kubernetes/config if not already set.)"
            }

            # 4) Upsert ACL policy 'redis-policy'
            printf 'path "kv/data/redis" { capabilities = ["read"] }\n' > /tmp/redis-policy.hcl
            curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: text/plain" \
              -X PUT --data-binary @/tmp/redis-policy.hcl \
              "${VAULT_ADDR}/v1/sys/policies/acl/redis-policy" >/dev/null

            # 5) Upsert Kubernetes role bound to SA 'redis' in ns 'redis'
            printf '{"bound_service_account_names":["redis"],"bound_service_account_namespaces":["redis"],"policies":["redis-policy"],"ttl":"24h"}' > /tmp/role.json
            VAULT_API POST auth/kubernetes/role/redis-role /tmp/role.json >/dev/null

            echo "🎉 Vault bootstrap complete."
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: redis
type: Opaque
data:
  # change this later: echo -n 'changeMeNow!' | base64
  password: Y2hhbmdlTWVOb3ch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    port 6379
    bind 0.0.0.0
    protected-mode no
    appendonly yes
    # RDB off by default; add 'save 900 1' if you want snapshots
    save ""
    tcp-keepalive 300
    timeout 0
    # Auth is injected at runtime via command args:
    #   requirepass <password>
    #   masterauth <password>

  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    protected-mode no
    daemonize no
    sentinel monitor mymaster redis-0.redis-headless.redis.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 60000
    sentinel resolve-hostnames yes

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels: { app: redis }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "redis-role"
        # KV v2 path; adjust if your mount path differs
        vault.hashicorp.com/agent-inject-secret-password: "kv/data/redis"
        vault.hashicorp.com/agent-inject-template-password: |
          {{- with secret "kv/data/redis" -}}
          {{ .Data.data.password }}
          {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      # Only schedule on work/srvr nodes; avoid ctrl/etcd without new labels
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values: ["work-node", "srvr-node"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: redis }
            topologyKey: kubernetes.io/hostname
      tolerations: [] # don’t tolerate control-plane/etcd taints
      securityContext:
        fsGroup: 1001
      volumes:
        - name: cfg-ro
          configMap:
            name: redis-config
        - name: cfg-rw
          emptyDir: {}
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: cfg-ro, mountPath: /config }   # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc","
              set -e
              REDIS_PASSWORD=$(cat /vault/secrets/password)
              cp /config/redis.conf /etc/redis/redis.conf
              echo \"requirepass ${REDIS_PASSWORD}\" >> /etc/redis/redis.conf
              echo \"masterauth ${REDIS_PASSWORD}\" >> /etc/redis/redis.conf
              case \"$(hostname)\" in *-0) ;; *) echo 'replicaof redis-0.redis-headless.redis.svc.cluster.local 6379' >> /etc/redis/redis.conf ;; esac
              trap 'redis-cli -a \"$(cat /vault/secrets/password)\" shutdown nosave || true' TERM INT
              exec redis-server /etc/redis/redis.conf
            "]
          readinessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "512Mi" }

        - name: sentinel
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 26379, name: sentinel }
          volumeMounts:
            - { name: cfg-ro, mountPath: /config }   # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc","
              set -e
              cp /config/sentinel.conf /etc/redis/sentinel.conf
              echo \"sentinel auth-pass mymaster $(cat /vault/secrets/password)\" >> /etc/redis/sentinel.conf
              exec redis-sentinel /etc/redis/sentinel.conf
            "]
          readinessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" -p 26379 ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["/bin/sh","-lc","redis-cli -a \"$(cat /vault/secrets/password)\" -p 26379 ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: redis
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis }
