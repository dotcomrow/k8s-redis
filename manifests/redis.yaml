---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: redis
type: Opaque
data:
  # change this later: echo -n 'changeMeNow!' | base64
  password: Y2hhbmdlTWVOb3ch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    port 6379
    bind 0.0.0.0
    protected-mode no
    appendonly yes
    # RDB off by default; add 'save 900 1' if you want snapshots
    save ""
    tcp-keepalive 300
    timeout 0
    # Auth is injected at runtime via command args:
    #   requirepass <password>
    #   masterauth <password>

  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    protected-mode no
    daemonize no
    sentinel monitor mymaster redis-0.redis-headless.redis.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 60000
    sentinel resolve-hostnames yes

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels: { app: redis }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      terminationGracePeriodSeconds: 30
      # Only schedule on work/srvr nodes; avoid ctrl/etcd without new labels
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values: ["work-node", "srvr-node"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: redis }
            topologyKey: kubernetes.io/hostname
      tolerations: [] # don’t tolerate control-plane/etcd taints
      securityContext:
        fsGroup: 1001
      volumes:
        - name: cfg-ro
          configMap:
            name: redis-config
        - name: cfg-rw
          emptyDir: {}
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: cfg-ro, mountPath: /config }   # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command:
            - /bin/sh
            - -lc
            - |
              set -e
              cp /config/redis.conf /etc/redis/redis.conf
              # Inject auth
              echo "requirepass ${REDIS_PASSWORD}" >> /etc/redis/redis.conf
              echo "masterauth ${REDIS_PASSWORD}" >> /etc/redis/redis.conf

              # Initial role: pod-0 primary, others replicas of pod-0
              case "$(hostname)" in
                *-0) echo "Starting as initial primary" ;;
                *)    echo "replicaof redis-0.redis-headless.redis.svc.cluster.local 6379" >> /etc/redis/redis.conf ;;
              esac

              # Graceful shutdown on SIGTERM
              trap 'redis-cli -a "$REDIS_PASSWORD" shutdown nosave || true' TERM INT
              exec redis-server /etc/redis/redis.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "512Mi" }

        - name: sentinel
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - { containerPort: 26379, name: sentinel }
          volumeMounts:
            - { name: cfg-ro, mountPath: /config }   # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command:
            - /bin/sh
            - -lc
            - |
              set -e
              cp /config/sentinel.conf /etc/redis/sentinel.conf
              # Inject auth so sentinel can talk to primary
              echo "sentinel auth-pass mymaster ${REDIS_PASSWORD}" >> /etc/redis/sentinel.conf
              exec redis-sentinel /etc/redis/sentinel.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","redis-cli -a \"$REDIS_PASSWORD\" -p 26379 ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","redis-cli -a \"$REDIS_PASSWORD\" -p 26379 ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: redis
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis }
