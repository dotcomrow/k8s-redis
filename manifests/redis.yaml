---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
    vault.hashicorp.com/agent-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-vault-bootstrap
  namespace: redis
---
# In the vault ns: allow reading just the 'vault-root-token' Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-vault-root-token
  namespace: vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["vault-root-token"]   # tighten to the exact Secret name you use
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-to-read-root-token
  namespace: vault
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-vault-root-token
---
# In the redis ns: allow creating/updating Secrets (only if you want to write any there)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: redis
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-secret-write
  namespace: redis
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: redis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-vault-bootstrap
  namespace: redis
spec:
  backoffLimit: 6
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: redis-vault-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      containers:
      - name: bootstrap
        image: alpine/k8s:1.31.4
        env:
          - name: VAULT_ADDR
            value: "http://vault.vault.svc.cluster.local:8200"
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -Eeux
            trap 'echo "❌ Bootstrap failed at line $LINENO"; exit 1' ERR

            echo "📦 Installing utilities (curl jq coreutils ca-certificates openssl grep sed)…"
            apk add --no-cache curl jq coreutils ca-certificates openssl grep sed
            update-ca-certificates || true
            export PATH="/usr/sbin:/usr/bin:/sbin:/bin"; hash -r

            # Sanity check
            /usr/bin/curl --version
            /usr/bin/jq --version
            /bin/cat /etc/alpine-release || true

            echo "🔐 Fetching Vault root/admin token from vault namespace…"
            get_tok() {
              key="$1"
              kubectl -n vault get secret vault-root-token \
                -o "go-template={{index .data \"${key}\" | base64decode}}" 2>/dev/null || true
            }
            VAULT_TOKEN="$(get_tok VAULT_TOKEN)"
            [ -n "${VAULT_TOKEN}" ] || VAULT_TOKEN="$(get_tok token)"
            [ -n "${VAULT_TOKEN}" ] || VAULT_TOKEN="$(get_tok root-token)"
            [ -n "${VAULT_TOKEN}" ] || VAULT_TOKEN="$(get_tok root_token)"
            if [ -z "${VAULT_TOKEN}" ]; then
              echo "❌ Could not decode token from Secret 'vault-root-token'. Keys present:"
              kubectl -n vault get secret vault-root-token -o jsonpath='{.data}' || true
              exit 1
            fi

            echo "⏳ Waiting for Vault health at ${VAULT_ADDR}…"
            i=0
            until /usr/bin/curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/sys/health" >/dev/null; do
              i=$((i+1)); [ "$i" -gt 120 ] && { echo "❌ Vault not healthy after ~240s"; exit 1; }
              sleep 2
            done
            echo "✅ Vault reachable. Bootstrapping secret/redis, secret/redisinsight, policy, roles, and Secrets…"

            VAULT_API() {
              METHOD="$1"; PATH="$2"; BODYFILE="${3:-}";
              if [ -n "$BODYFILE" ]; then
                HTTP="$(/usr/bin/curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
                  -X "$METHOD" --data-binary @"$BODYFILE" \
                  "${VAULT_ADDR}/v1/${PATH}" || true)"
              else
                HTTP="$(/usr/bin/curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" \
                  -X "$METHOD" "${VAULT_ADDR}/v1/${PATH}" || true)"
              fi
              if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 400 ]; then
                echo "❌ ${METHOD} /v1/${PATH} -> HTTP ${HTTP}"
                echo "── Response:"; /bin/cat /tmp/resp.txt || true
                exit 1
              fi
              /bin/cat /tmp/resp.txt
            }

            # 1) Ensure KV v2 at 'secret/' (default mount)
            MOUNTS_JSON="$(VAULT_API GET sys/mounts)"
            echo "$MOUNTS_JSON" | /usr/bin/jq -e '."secret/".options.version=="2"' >/dev/null 2>&1 || {
              echo "ℹ️ Enabling KV v2 at path 'secret/'"
              printf '{"type":"kv","options":{"version":"2"}}' > /tmp/secret-enable.json
              VAULT_API POST sys/mounts/secret /tmp/secret-enable.json >/dev/null
            }
            # sanity re-check
            MOUNTS_JSON="$(VAULT_API GET sys/mounts)"
            echo "$MOUNTS_JSON" | /usr/bin/jq -e '."secret/".options.version=="2"' >/dev/null

            # 2) Ensure secret/redis exists (KV v2 data API) and capture password
            if ! /usr/bin/curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/secret/data/redis" >/dev/null; then
              VAULT_PW_GEN="$(/usr/bin/openssl rand -base64 32 | tr -d '\n=')"
              printf '{"data":{"password":"%s"}}' "${VAULT_PW_GEN}" > /tmp/secret-redis.json
              echo "🔑 Creating secret/redis"
              VAULT_API POST secret/data/redis /tmp/secret-redis.json >/dev/null
            fi
            VAULT_PW="$(/usr/bin/curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
              "${VAULT_ADDR}/v1/secret/data/redis" | /usr/bin/jq -r '.data.data.password')"
            if [ -z "${VAULT_PW}" ] || [ "${VAULT_PW}" = "null" ]; then
              echo "❌ No password found at secret/redis"; exit 1
            fi

            # 3) Ensure kubernetes auth is enabled
            AUTHS_JSON="$(VAULT_API GET sys/auth)"
            if ! echo "$AUTHS_JSON" | /usr/bin/jq -e '."kubernetes/".type=="kubernetes"' >/dev/null 2>&1; then
              echo "ℹ️ Enabling kubernetes auth at 'auth/kubernetes'"
              printf '{"type":"kubernetes"}' > /tmp/auth-enable.json
              VAULT_API POST sys/auth/kubernetes /tmp/auth-enable.json >/dev/null
            fi

            # 4) Upsert ACL policy 'redis-policy' for secret/ (KV v2 data/metadata)
            printf '%s' \
              '{"policy":"path \"secret/data/redis\" { capabilities = [\"read\"] }\npath \"secret/metadata/redis\" { capabilities = [\"read\"] }"}' \
              > /tmp/redis-policy.json
            VAULT_API PUT sys/policies/acl/redis-policy /tmp/redis-policy.json >/dev/null
            VAULT_API GET sys/policies/acl/redis-policy | /usr/bin/jq -r '.data.policy' || true

            # 5) Upsert Kubernetes role bound to SA 'redis' in ns 'redis'
            printf '{"bound_service_account_names":["redis"],"bound_service_account_namespaces":["redis"],"policies":["redis-policy"],"ttl":"24h"}' > /tmp/role.json
            VAULT_API POST auth/kubernetes/role/redis-role /tmp/role.json >/dev/null

            # 6) Mirror password from Vault into a k8s Secret 'redis-auth' (for clients like RedisInsight)
            echo "🔁 Syncing password into Secret redis/redis-auth"
            B64PW="$(printf '%s' "${VAULT_PW}" | /usr/bin/openssl base64 -A)"
            kubectl apply -n redis -f - <<EOF
            apiVersion: v1
            kind: Secret
            metadata:
              name: redis-auth
              namespace: redis
            type: Opaque
            data:
              password: ${B64PW}
            EOF

            # 7) Ensure secret/redisinsight has RI_ENCRYPTION_KEY and mirror to k8s
            if ! /usr/bin/curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/secret/data/redisinsight" >/dev/null; then
              ENC_KEY="$(/usr/bin/openssl rand -base64 48 | tr -d '\n=')"   # long random string
              printf '{"data":{"RI_ENCRYPTION_KEY":"%s"}}' "${ENC_KEY}" > /tmp/secret-redisinsight.json
              echo "🔐 Creating secret/redisinsight"
              VAULT_API POST secret/data/redisinsight /tmp/secret-redisinsight.json >/dev/null
            fi
            RI_KEY="$(/usr/bin/curl -sf -H "X-Vault-Token: ${VAULT_TOKEN}" \
              "${VAULT_ADDR}/v1/secret/data/redisinsight" | /usr/bin/jq -r '.data.data.RI_ENCRYPTION_KEY')"
            if [ -z "${RI_KEY}" ] || [ "${RI_KEY}" = "null" ]; then
              echo "❌ No RI_ENCRYPTION_KEY in secret/redisinsight"; exit 1
            fi

            echo "🔁 Syncing RedisInsight encryption key into Secret redis/redisinsight-secrets"
            B64_RI_KEY="$(printf '%s' "${RI_KEY}" | /usr/bin/openssl base64 -A)"
            kubectl apply -n redis -f - <<EOF
            apiVersion: v1
            kind: Secret
            metadata:
              name: redisinsight-secrets
              namespace: redis
            type: Opaque
            data:
              RI_ENCRYPTION_KEY: ${B64_RI_KEY}
            EOF

            echo "🎉 Vault bootstrap complete."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    port 6379
    bind 0.0.0.0
    protected-mode no
    appendonly yes
    # RDB off by default; add 'save 900 1' if you want snapshots
    save ""
    tcp-keepalive 300
    timeout 0
    # Auth is injected at runtime via command args:
    #   requirepass <password>
    #   masterauth <password>

  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    protected-mode no
    daemonize no
    sentinel monitor mymaster redis-0.redis-headless.redis.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 60000
    sentinel resolve-hostnames yes

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels: { app: redis }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "redis-role"
        # KV v2 path under 'secret/' mount (Argo CD Vault Plugin-friendly)
        vault.hashicorp.com/agent-inject-secret-password: "secret/data/redis"
        vault.hashicorp.com/agent-inject-template-password: |
          {{- with secret "secret/data/redis" -}}
          {{ .Data.data.password }}
          {{- end }}
    spec:
      serviceAccountName: redis
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values: ["work-node", "srvr-node"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: redis }
            topologyKey: kubernetes.io/hostname
      tolerations: []
      securityContext:
        fsGroup: 1001
      volumes:
        - name: cfg-ro
          configMap:
            name: redis-config
        - name: cfg-rw
          emptyDir: {}
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data,  mountPath: /data }
            - { name: cfg-ro, mountPath: /config }    # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              if ! read -r REDIS_PASSWORD < /vault/secrets/password; then
                echo "no password at /vault/secrets/password"; exit 1
              fi

              cp /config/redis.conf /etc/redis/redis.conf
              echo "requirepass ${REDIS_PASSWORD}"  >> /etc/redis/redis.conf
              echo "masterauth ${REDIS_PASSWORD}"   >> /etc/redis/redis.conf

              HN="$(hostname)"
              case "$HN" in
                *-0) : ;;  # primary
                *) echo 'replicaof redis-0.redis-headless.redis.svc.cluster.local 6379' >> /etc/redis/redis.conf ;;
              esac

              trap 'redis-cli -a "$REDIS_PASSWORD" shutdown nosave || true' TERM INT
              exec redis-server /etc/redis/redis.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -a \"$P\" PING | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -a \"$P\" PING | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   {           memory: "512Mi" }

        - name: sentinel
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 26379, name: sentinel }
          volumeMounts:
            - { name: cfg-ro, mountPath: /config }    # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              if ! read -r PASSWORD < /vault/secrets/password; then
                echo "no password at /vault/secrets/password"; exit 1
              fi
              cp /config/sentinel.conf /etc/redis/sentinel.conf
              echo "sentinel auth-pass mymaster ${PASSWORD}" >> /etc/redis/sentinel.conf
              exec redis-sentinel /etc/redis/sentinel.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -p 26379 PING | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -p 26379 PING | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: redis
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis }
---
# ===== RedisInsight dashboard (Secret generated from Vault secret/ by bootstrap Job) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: redis
spec:
  replicas: 1
  selector: { matchLabels: { app: redisinsight } }
  template:
    metadata:
      labels: { app: redisinsight }
      annotations:
        linkerd.io/inject: disabled
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5540, name: http }]
          env:
            - name: RI_ACCEPT_TERMS_AND_CONDITIONS
              value: "true"
            - name: RI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: redisinsight-secrets
                  key: RI_ENCRYPTION_KEY

            # Preconfigure a connection to the in-cluster Redis service
            - name: RI_REDIS_ALIAS0
              value: "cluster-redis"
            - name: RI_REDIS_HOST0
              value: "redis.redis.svc.cluster.local"
            - name: RI_REDIS_PORT0
              value: "6379"
            - name: RI_REDIS_USERNAME0
              value: "default"
            - name: RI_REDIS_PASSWORD0
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          emptyDir: {}   # swap to a PVC for persistence
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: redis
spec:
  selector: { app: redisinsight }
  ports:
    - { port: 80, targetPort: 5540, name: http }
  type: ClusterIP
