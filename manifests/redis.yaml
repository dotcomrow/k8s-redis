---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
    vault.hashicorp.com/agent-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-vault-bootstrap
  namespace: redis
---
# In the vault ns: allow reading just the 'vault-root-token' Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-vault-root-token
  namespace: vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["vault-root-token"]   # tighten to the exact Secret name you use
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-to-read-root-token
  namespace: vault
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-vault-root-token
---
# In the redis ns: allow creating/updating Secrets (only if you want to write any there)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: redis
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-redis-bootstrap-secret-write
  namespace: redis
subjects:
- kind: ServiceAccount
  name: redis-vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: redis
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-redis-bootstrap
  namespace: vault
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: alpine:3.21
        imagePullPolicy: IfNotPresent
        env:
        - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
        - { name: VAULT_NS, value: "vault" }
        - { name: VAULT_ROOT_SECRET_NAME, value: "vault-root-token" }
        - { name: APP_NS, value: "redis" }
        - { name: VAULT_K8S_ROLE, value: "redis-role" }
        - { name: VAULT_K8S_POLICY, value: "redis-policy" }
        - { name: VAULT_K8S_SA, value: "redis" }
        - { name: VAULT_REDIS_PATH, value: "secret/data/redis" }
        - { name: VAULT_REDIS_META, value: "secret/metadata/redis" }
        - { name: VAULT_RI_PATH, value: "secret/data/redisinsight" }
        command: ["/bin/sh","-euc"]
        args:
        - |
          trap 'echo "❌ Bootstrap failed at line $LINENO"; exit 1' ERR

          echo "📦 Installing utilities (curl jq kubectl coreutils ca-certificates openssl grep sed)…"
          apk add --no-cache curl jq kubectl coreutils ca-certificates openssl grep sed >/dev/null
          update-ca-certificates >/dev/null

          VAULT_API() {
            METHOD="$1"; PATH_="$2"; BODYFILE="${3:-}"
            if [ -n "$BODYFILE" ]; then
              HTTP="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                -H "X-Vault-Token: $VAULT_TOKEN" -H "Content-Type: application/json" \
                -X "$METHOD" --data-binary @"$BODYFILE" "$VAULT_ADDR/v1/$PATH_")"
            else
              HTTP="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                -H "X-Vault-Token: $VAULT_TOKEN" -X "$METHOD" "$VAULT_ADDR/v1/$PATH_")"
            fi
            if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 400 ]; then
              echo "💥 Vault API $METHOD $PATH_ failed (HTTP $HTTP) – body:"
              cat /tmp/resp.txt || true
              return 1
            fi
            cat /tmp/resp.txt
            return 0
          }

          echo "🔐 Fetching Vault root/admin token from $VAULT_NS/$VAULT_ROOT_SECRET_NAME…"
          VAULT_TOKEN="$(kubectl -n "$VAULT_NS" get secret "$VAULT_ROOT_SECRET_NAME" -o 'go-template={{index .data "VAULT_TOKEN" | base64decode}}')"
          [ -n "$VAULT_TOKEN" ]

          echo "⏳ Waiting for Vault health at $VAULT_ADDR…"
          i=0
          until curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/sys/health" >/dev/null; do
            i=$((i+1)); [ "$i" -gt 60 ] && { echo "Vault not healthy"; exit 1; }
            sleep 2
          done
          echo "✅ Vault reachable. Bootstrapping secret/redis, secret/redisinsight, policy, roles, and Secrets…"

          # Ensure secret/ is KV v2
          MOUNTS_JSON="$(VAULT_API GET sys/mounts)" || exit 1
          printf '%s' "$MOUNTS_JSON" | jq -e '."secret/".options.version=="2"' >/dev/null

          # ── Create/ensure secret/data/redis
          if ! REDIS_JSON="$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/$VAULT_REDIS_PATH")"; then
            echo "🔑 Creating new password at $VAULT_REDIS_PATH"
            PW="$(openssl rand -base64 32)"
            printf '{"data":{"password":"%s"}}' "$PW" > /tmp/secret-redis.json
            echo "…payload:"; cat /tmp/secret-redis.json
            # first attempt
            if ! VAULT_API POST "$VAULT_REDIS_PATH" /tmp/secret-redis.json; then
              echo "⏳ Retry once in 2s…"; sleep 2
              VAULT_API POST "$VAULT_REDIS_PATH" /tmp/secret-redis.json
            fi
            VAULT_PW="$PW"
          else
            VAULT_PW="$(printf '%s' "$REDIS_JSON" | jq -r '.data.data.password')"
            if [ -z "$VAULT_PW" ] || [ "$VAULT_PW" = "null" ]; then
              echo "ℹ️ password field missing; generating…"
              PW="$(openssl rand -base64 32)"
              printf '{"data":{"password":"%s"}}' "$PW" > /tmp/secret-redis.json
              echo "…payload:"; cat /tmp/secret-redis.json
              VAULT_API POST "$VAULT_REDIS_PATH" /tmp/secret-redis.json
              VAULT_PW="$PW"
            fi
          fi

          # ── Kubernetes auth present
          AUTHS_JSON="$(VAULT_API GET sys/auth)" || exit 1
          printf '%s' "$AUTHS_JSON" | jq -e '."kubernetes/".type=="kubernetes"' >/dev/null

          # ── Policy & role
          printf '{"policy":"path \"%s\" { capabilities = [\"read\"] }\npath \"%s\" { capabilities = [\"read\"] }"}' \
            "$VAULT_REDIS_PATH" "$VAULT_REDIS_META" > /tmp/redis-policy.json
          VAULT_API PUT "sys/policies/acl/$VAULT_K8S_POLICY" /tmp/redis-policy.json >/dev/null || exit 1

          printf '{"bound_service_account_names":["%s"],"bound_service_account_namespaces":["%s"],"policies":["%s"],"ttl":"24h"}' \
            "$VAULT_K8S_SA" "$APP_NS" "$VAULT_K8S_POLICY" > /tmp/role.json
          VAULT_API POST "auth/kubernetes/role/$VAULT_K8S_ROLE" /tmp/role.json >/dev/null || exit 1

          # ── Sync Redis password into K8s Secret
          B64PW="$(printf '%s' "$VAULT_PW" | openssl base64 -A)"
          cat <<EOF | kubectl apply -n "$APP_NS" -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: redis-auth
            namespace: ${APP_NS}
          type: Opaque
          data:
            password: ${B64PW}
          EOF

          # ── RedisInsight key (ensure)
          if ! RI_JSON="$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/$VAULT_RI_PATH")"; then
            echo "🔐 Creating new RI_ENCRYPTION_KEY at $VAULT_RI_PATH"
            ENC_KEY="$(openssl rand -base64 48 | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n//g')"
            printf '{"data":{"RI_ENCRYPTION_KEY":"%s"}}' "$ENC_KEY" > /tmp/secret-ri.json
            echo "…payload:"; cat /tmp/secret-ri.json
            VAULT_API POST "$VAULT_RI_PATH" /tmp/secret-ri.json
            RI_KEY="$ENC_KEY"
          else
            RI_KEY="$(printf '%s' "$RI_JSON" | jq -r '.data.data.RI_ENCRYPTION_KEY')"
            if [ -z "$RI_KEY" ] || [ "$RI_KEY" = "null" ]; then
              ENC_KEY="$(openssl rand -base64 48 | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n//g')"
              printf '{"data":{"RI_ENCRYPTION_KEY":"%s"}}' "$ENC_KEY" > /tmp/secret-ri.json
              echo "…payload:"; cat /tmp/secret-ri.json
              VAULT_API POST "$VAULT_RI_PATH" /tmp/secret-ri.json
              RI_KEY="$ENC_KEY"
            fi
          fi

          B64_RI_KEY="$(printf '%s' "$RI_KEY" | openssl base64 -A)"
          cat <<EOF | kubectl apply -n "$APP_NS" -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: redisinsight-secrets
            namespace: ${APP_NS}
          type: Opaque
          data:
            RI_ENCRYPTION_KEY: ${B64_RI_KEY}
          EOF

          echo "🎉 Bootstrap complete."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    port 6379
    bind 0.0.0.0
    protected-mode no
    appendonly yes
    # RDB off by default; add 'save 900 1' if you want snapshots
    save ""
    tcp-keepalive 300
    timeout 0
    # Auth is injected at runtime via command args:
    #   requirepass <password>
    #   masterauth <password>

  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    protected-mode no
    daemonize no
    sentinel monitor mymaster redis-0.redis-headless.redis.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 60000
    sentinel resolve-hostnames yes

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels: { app: redis }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "redis-role"
        # KV v2 path under 'secret/' mount (Argo CD Vault Plugin-friendly)
        vault.hashicorp.com/agent-inject-secret-password: "secret/data/redis"
        vault.hashicorp.com/agent-inject-template-password: |
          {{- with secret "secret/data/redis" -}}
          {{ .Data.data.password }}
          {{- end }}
    spec:
      serviceAccountName: redis
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values: ["work-node", "srvr-node"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: redis }
            topologyKey: kubernetes.io/hostname
      tolerations: []
      securityContext:
        fsGroup: 1001
      volumes:
        - name: cfg-ro
          configMap:
            name: redis-config
        - name: cfg-rw
          emptyDir: {}
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data,  mountPath: /data }
            - { name: cfg-ro, mountPath: /config }    # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              if ! read -r REDIS_PASSWORD < /vault/secrets/password; then
                echo "no password at /vault/secrets/password"; exit 1
              fi

              cp /config/redis.conf /etc/redis/redis.conf
              echo "requirepass ${REDIS_PASSWORD}"  >> /etc/redis/redis.conf
              echo "masterauth ${REDIS_PASSWORD}"   >> /etc/redis/redis.conf

              HN="$(hostname)"
              case "$HN" in
                *-0) : ;;  # primary
                *) echo 'replicaof redis-0.redis-headless.redis.svc.cluster.local 6379' >> /etc/redis/redis.conf ;;
              esac

              trap 'redis-cli -a "$REDIS_PASSWORD" shutdown nosave || true' TERM INT
              exec redis-server /etc/redis/redis.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -a \"$P\" PING | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -a \"$P\" PING | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   {           memory: "512Mi" }

        - name: sentinel
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 26379, name: sentinel }
          volumeMounts:
            - { name: cfg-ro, mountPath: /config }    # read-only source
            - { name: cfg-rw, mountPath: /etc/redis } # writable target
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              if ! read -r PASSWORD < /vault/secrets/password; then
                echo "no password at /vault/secrets/password"; exit 1
              fi
              cp /config/sentinel.conf /etc/redis/sentinel.conf
              echo "sentinel auth-pass mymaster ${PASSWORD}" >> /etc/redis/sentinel.conf
              exec redis-sentinel /etc/redis/sentinel.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -p 26379 PING | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -p 26379 PING | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: redis
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis }
---
# ===== RedisInsight dashboard (Secret generated from Vault secret/ by bootstrap Job) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: redis
spec:
  replicas: 1
  selector: { matchLabels: { app: redisinsight } }
  template:
    metadata:
      labels: { app: redisinsight }
      annotations:
        linkerd.io/inject: disabled
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5540, name: http }]
          env:
            - name: RI_ACCEPT_TERMS_AND_CONDITIONS
              value: "true"
            - name: RI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: redisinsight-secrets
                  key: RI_ENCRYPTION_KEY

            # Preconfigure a connection to the in-cluster Redis service
            - name: RI_REDIS_ALIAS0
              value: "cluster-redis"
            - name: RI_REDIS_HOST0
              value: "redis.redis.svc.cluster.local"
            - name: RI_REDIS_PORT0
              value: "6379"
            - name: RI_REDIS_USERNAME0
              value: "default"
            - name: RI_REDIS_PASSWORD0
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          emptyDir: {}   # swap to a PVC for persistence
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: redis
spec:
  selector: { app: redisinsight }
  ports:
    - { port: 80, targetPort: 5540, name: http }
  type: ClusterIP
