---
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    app: redis
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
    vault.hashicorp.com/agent-injection: enabled

---
# --- Service Accounts ---------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-bootstrap
  namespace: redis
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: redis

---
# --- RBAC: allow reading the Vault root token (in vault ns) -------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-vault-root-token
  namespace: vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["vault-root-token"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-vault-bootstrap-to-read-root-token
  namespace: vault
subjects:
- kind: ServiceAccount
  name: vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-vault-root-token

---
# --- RBAC: allow writing Secrets in redis ns ---------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: redis
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-vault-bootstrap-secret-write
  namespace: redis
subjects:
- kind: ServiceAccount
  name: vault-bootstrap
  namespace: redis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer

---
# --- ONE merged bootstrap Job: Vault + Redis + RedisInsight (no RDI) ----------
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-redis-bootstrap
  namespace: redis
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: vault-redis-bootstrap
    spec:
      serviceAccountName: vault-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: B64_LINE_WRAP
              value: "A"   # openssl base64 -A (no wrap)
            # Vault KV v2 paths
            - name: VAULT_REDIS_PATH_DATA
              value: "secret/data/redis"
            - name: VAULT_RI_PATH_DATA
              value: "secret/data/redisinsight"
            # K8s Secret names materialized from Vault values
            - name: K8S_SECRET_REDIS_AUTH
              value: "redis-auth"
            - name: K8S_SECRET_RI
              value: "redisinsight-secrets"
            # (Optional) Vault K8s auth policy/role for redis Pods
            - name: VAULT_K8S_ROLE
              value: "redis-role"
            - name: VAULT_K8S_POLICY
              value: "redis-policy"
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              echo "📦 Installing utilities (curl jq kubectl coreutils ca-certificates openssl grep sed)…"
              apk add --no-cache curl jq kubectl coreutils ca-certificates openssl grep sed >/dev/null
              update-ca-certificates >/dev/null 2>&1 || true

              VAULT_API() {
                _m="$1"; _p="$2"; _body="${3:-}"
                if [ -n "$_body" ]; then
                  curl -sS -H "X-Vault-Token: $VAULT_TOKEN" -H 'Content-Type: application/json' -X "$_m" --data "$_body" "$VAULT_ADDR/v1/$_p"
                else
                  curl -sS -H "X-Vault-Token: $VAULT_TOKEN" -X "$_m" "$VAULT_ADDR/v1/$_p"
                fi
              }

              echo "🔐 Fetching Vault admin token from vault/vault-root-token…"
              VAULT_TOKEN="$(kubectl -n vault get secret vault-root-token -o 'go-template={{index .data "VAULT_TOKEN" | base64decode}}')"

              echo "⏳ Waiting for Vault health at ${VAULT_ADDR}…"
              i=0
              until curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/sys/health" >/dev/null; do
                i=$((i+1))
                [ "$i" -gt 120 ] && echo "❌ Vault not healthy in time" && exit 1
                sleep 2
              done
              echo "✅ Vault reachable."

              echo "🔎 Verifying 'secret/' is KV v2…"
              MOUNTS_JSON="$(VAULT_API GET sys/mounts)"
              if ! printf '%s' "$MOUNTS_JSON" | jq -e '."secret/".type=="kv" and (."secret/".options.version=="2")' >/dev/null 2>&1; then
                echo "❌ Vault mount secret/ is missing or not KV v2"; exit 1
              fi

              # --- 1) Redis password -> Vault -> K8s Secret redis-auth ---------
              echo "🧩 Ensuring Redis password at $VAULT_REDIS_PATH_DATA…"
              set +e
              REDIS_PW="$(VAULT_API GET "$VAULT_REDIS_PATH_DATA" | jq -er '.data.data.password' 2>/dev/null)"
              rc=$?
              set -e
              if [ $rc -ne 0 ] || [ -z "${REDIS_PW:-}" ]; then
                REDIS_PW="$(openssl rand -base64 36)"
                BODY="$(jq -Rn --arg p "$REDIS_PW" '{data:{password:$p}}')"
                VAULT_API POST "$VAULT_REDIS_PATH_DATA" "$BODY" >/dev/null
                echo "✅ Created new Redis password in Vault."
              else
                echo "♻️  Reusing existing Redis password (len=$(printf '%s' "$REDIS_PW" | wc -c))"
              fi

              echo "🧾 Applying Secret ${K8S_SECRET_REDIS_AUTH} (redis)…"
              B64PW="$(printf '%s' "$REDIS_PW" | openssl base64 -$B64_LINE_WRAP)"
              cat <<EOF | kubectl apply -n redis -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${K8S_SECRET_REDIS_AUTH}
              type: Opaque
              data:
                password: ${B64PW}
              EOF

              # --- 2) RedisInsight encryption key -> Vault -> K8s Secret -------
              echo "🧩 Ensuring RedisInsight key at $VAULT_RI_PATH_DATA…"
              set +e
              RI_KEY="$(VAULT_API GET "$VAULT_RI_PATH_DATA" | jq -er '.data.data.encryption_key' 2>/dev/null)"
              rc=$?
              set -e
              if [ $rc -ne 0 ] || [ -z "${RI_KEY:-}" ]; then
                RI_KEY="$(openssl rand -base64 48 | tr -d '\n=')"
                RI_BODY="$(jq -Rn --arg k "$RI_KEY" '{data:{encryption_key:$k}}')"
                VAULT_API POST "$VAULT_RI_PATH_DATA" "$RI_BODY" >/dev/null
                echo "✅ Created new RedisInsight encryption key in Vault."
              else
                echo "♻️  Reusing existing RedisInsight encryption key (len=$(printf '%s' "$RI_KEY" | wc -c))"
              fi

              echo "🧾 Applying Secret ${K8S_SECRET_RI} (redis)…"
              B64_RI="$(printf '%s' "$RI_KEY" | openssl base64 -$B64_LINE_WRAP)"
              cat <<EOF | kubectl apply -n redis -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: ${K8S_SECRET_RI}
              type: Opaque
              data:
                RI_APP_ENCRYPTION_KEY: ${B64_RI}
              EOF

              # --- 3) (Optional) Vault policy/role for redis Pods --------------
              echo "🔎 Checking Vault auth backends…"
              SKIP_K8S_AUTH=0
              if AUTHS_JSON="$(VAULT_API GET sys/auth)"; then
                if ! printf '%s' "$AUTHS_JSON" | jq -e '."kubernetes/".type=="kubernetes"' >/dev/null 2>&1; then
                  echo "⚠️  Vault Kubernetes auth not enabled; skipping role/policy bind."
                  SKIP_K8S_AUTH=1
                fi
              else
                echo "⚠️  Could not query sys/auth; skipping role/policy bind."
                SKIP_K8S_AUTH=1
              fi

              if [ "$SKIP_K8S_AUTH" -eq 0 ] ; then
                echo "🧩 Ensuring policy ${VAULT_K8S_POLICY} and role ${VAULT_K8S_ROLE}…"
                printf '%s' "{\"policy\":\"path \\\"secret/data/redis\\\" { capabilities = [\\\"read\\\"] }\npath \\\"secret/metadata/redis\\\" { capabilities = [\\\"read\\\"] }\"}" > /tmp/redis-policy.json
                VAULT_API PUT "sys/policies/acl/${VAULT_K8S_POLICY}" "$(cat /tmp/redis-policy.json)" >/dev/null

                ROLE_JSON="$(jq -n \
                  --argjson names '["redis"]' \
                  --argjson namespaces '["redis"]' \
                  --arg policy "$VAULT_K8S_POLICY" \
                  '{bound_service_account_names:$names, bound_service_account_namespaces:$namespaces, policies:[$policy], ttl:"24h"}')"
                VAULT_API POST "auth/kubernetes/role/${VAULT_K8S_ROLE}" "$ROLE_JSON" >/dev/null
              else
                echo "ℹ️  Skipped policy/role creation."
              fi

              echo "✅ Vault + Redis + RedisInsight bootstrap complete."

---
# --- Redis config -------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    port 6379
    bind 0.0.0.0
    protected-mode no
    appendonly yes
    save ""
    tcp-keepalive 300
    timeout 0
  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    protected-mode no
    daemonize no
    sentinel monitor mymaster redis-0.redis-headless.redis.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 60000
    sentinel resolve-hostnames yes

---
# --- Services -----------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: redis
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
  labels: { app: redis }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379

---
# --- Redis StatefulSet + Sentinel --------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "redis-role"
        vault.hashicorp.com/agent-inject-secret-password: "secret/data/redis"
        vault.hashicorp.com/agent-inject-template-password: |
          {{- with secret "secret/data/redis" -}}
          {{ .Data.data.password }}
          {{- end }}
    spec:
      serviceAccountName: redis
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: dedicated
                operator: In
                values: ["work-node", "srvr-node"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: { app: redis }
            topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1001
      volumes:
        - name: cfg-ro
          configMap:
            name: redis-config
        - name: cfg-rw
          emptyDir: {}
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data,  mountPath: /data }
            - { name: cfg-ro, mountPath: /config }
            - { name: cfg-rw, mountPath: /etc/redis }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              if ! read -r REDIS_PASSWORD < /vault/secrets/password; then
                echo "no password at /vault/secrets/password"; exit 1
              fi
              cp /config/redis.conf /etc/redis/redis.conf
              echo "requirepass ${REDIS_PASSWORD}"  >> /etc/redis/redis.conf
              echo "masterauth ${REDIS_PASSWORD}"   >> /etc/redis/redis.conf
              HN="$(hostname)"
              case "$HN" in
                *-0) : ;;  # primary
                *) echo 'replicaof redis-0.redis-headless.redis.svc.cluster.local 6379' >> /etc/redis/redis.conf ;;
              esac
              trap 'redis-cli -a "$REDIS_PASSWORD" shutdown nosave || true' TERM INT
              exec redis-server /etc/redis/redis.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -a \"$P\" PING | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -a \"$P\" PING | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   {           memory: "512Mi" }
        - name: sentinel
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 26379, name: sentinel }
          volumeMounts:
            - { name: cfg-ro, mountPath: /config }
            - { name: cfg-rw, mountPath: /etc/redis }
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              if ! read -r PASSWORD < /vault/secrets/password; then
                echo "no password at /vault/secrets/password"; exit 1
              fi
              cp /config/sentinel.conf /etc/redis/sentinel.conf
              echo "sentinel auth-pass mymaster ${PASSWORD}" >> /etc/redis/sentinel.conf
              exec redis-sentinel /etc/redis/sentinel.conf
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -p 26379 PING | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","read -r P </vault/secrets/password && redis-cli -p 26379 PING | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: redis
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis }

---
# --- RedisInsight -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: redis
spec:
  replicas: 1
  selector: { matchLabels: { app: redisinsight } }
  template:
    metadata:
      labels: { app: redisinsight }
      annotations:
        linkerd.io/inject: disabled
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5540, name: http }]
          env:
            - name: RI_ACCEPT_TERMS_AND_CONDITIONS
              value: "true"
            - name: RI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: redisinsight-secrets
                  key: RI_APP_ENCRYPTION_KEY
            - name: RI_REDIS_ALIAS0
              value: "cluster-redis"
            - name: RI_REDIS_HOST0
              value: "redis.redis.svc.cluster.local"
            - name: RI_REDIS_PORT0
              value: "6379"
            - name: RI_REDIS_USERNAME0
              value: "default"
            - name: RI_REDIS_PASSWORD0
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: redis
spec:
  selector: { app: redisinsight }
  ports:
    - { port: 80, targetPort: 5540, name: http }
  type: ClusterIP

---
# --- OAuth2 Proxy in front of RedisInsight -----------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-redisinsight
  namespace: redis
  labels:
    app: oauth2-proxy
    component: redisinsight
  annotations:
    linkerd.io/inject: disabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: redisinsight
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: redisinsight
      annotations:
        linkerd.io/inject: disabled
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            # Point to the RedisInsight service (Service maps 80 -> 5540)
            - --upstream=http://redisinsight.redis.svc.cluster.local:80
            - --provider=github
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://redisui.app.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            # Restrict access to a specific GitHub org/team (adjust to your needs)
            - --allowed-group=dotcomrow:redis_admin_gui
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: redisinsight-oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: redisinsight-oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: redisinsight-oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-redisinsight
  namespace: redis
  labels:
    app: oauth2-proxy
    component: redisinsight
    teleport.dev/enroll: "true"
    app.kubernetes.io/name: redisinsight
    app.kubernetes.io/component: redis
    teleport.dev/app: "redisinsight"
  annotations:
    teleport.dev/name: "redis-gui"
    teleport.dev/protocol: "http"
    teleport.dev/public_addr: "redis-gui.app.suncoast.systems"
    teleport.dev/labels: "environment=production,service=redis"

spec:
  selector:
    app: oauth2-proxy
    component: redisinsight
  ports:
    - port: 4180
      targetPort: 4180
      name: http

---
# AVP-style placeholders for Vault. Replace paths/keys if you prefer different secrets.
apiVersion: v1
kind: Secret
metadata:
  name: redisinsight-oauth2-proxy-creds
  namespace: redis
type: Opaque
stringData:
  client-id: "<path:secret/data/redisinsight-oauth2-client-id#value>"
  client-secret: "<path:secret/data/redisinsight-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/redisinsight-oauth2-cookie-secret#value>"
